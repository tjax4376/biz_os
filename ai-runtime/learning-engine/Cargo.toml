[package]
name = "learning-engine"
version = "0.1.0"
edition = "2021"
authors = ["BIZ_OS Team"]
description = "Learning and data fabric components for BIZ_OS"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
async-nats = { version = "0.33", default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
petgraph = "0.6"
rand = "0.8"
parking_lot = "0.12"
