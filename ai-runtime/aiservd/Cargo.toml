[package]
name = "aiservd"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"

# Model management
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

# System integration
libc = "0.2"
nix = "0.27"

# HTTP server for REST API
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Diagnostic service (local path)
diagnostic-service = { path = "../diagnostic-service" }

# Learning engine (local path, will be workspace member later)
learning-engine = { path = "../learning-engine" }

# Ingestion gRPC
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
prost-types = "0.12"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "aiservd"
path = "src/main.rs"

